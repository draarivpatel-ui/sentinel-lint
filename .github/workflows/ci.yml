name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    name: node ${{ matrix.node }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22, 24]
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: test
        run: npm test
      - name: self scan
        run: npm run self-scan

  fuzz:
    permissions:
      contents: read
    name: property fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: install development dependencies
        run: npm ci --ignore-scripts
      - name: run property fuzz tests
        run: npm run test:fuzz

  action-smoke:
    permissions:
      contents: read
    name: action smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: scan clean example
        id: clean
        uses: ./
        with:
          path: examples/clean-repo
          sarif-file: clean.sarif
      - name: verify clean example
        shell: bash
        env:
          SARIF_PATH: clean.sarif
          OUTPUT_SARIF_FILE: ${{ steps.clean.outputs.sarif-file }}
          OUTPUT_FINDINGS_COUNT: ${{ steps.clean.outputs.findings-count }}
          OUTPUT_EXIT_CODE: ${{ steps.clean.outputs.exit-code }}
        run: node tests/verify-action-smoke.mjs clean
      - name: scan vulnerable example
        id: vulnerable
        uses: ./
        with:
          path: examples/vulnerable-repo
          fail-on: none
          sarif-file: vulnerable.sarif
      - name: verify vulnerable example
        shell: bash
        env:
          SARIF_PATH: vulnerable.sarif
          OUTPUT_SARIF_FILE: ${{ steps.vulnerable.outputs.sarif-file }}
          OUTPUT_FINDINGS_COUNT: ${{ steps.vulnerable.outputs.findings-count }}
          OUTPUT_EXIT_CODE: ${{ steps.vulnerable.outputs.exit-code }}
        run: node tests/verify-action-smoke.mjs vulnerable
